services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkQkQmVkNTNlNTAxNDk4Ng
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo '[INFO] Initializing Kafka topics...';
      sleep 10;
      
      echo '[INFO] Creating email-notifications topic...';
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic email-notifications --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete || true;
      
      echo '[INFO] Creating email-dlq topic...';
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic email-dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete || true;
      
      echo '[INFO] Creating complaint-status-events topic (Event Sourcing)...';
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic complaint-status-events --partitions 3 --replication-factor 1 --config retention.ms=-1 --config cleanup.policy=compact || true;
      
      echo '[SUCCESS] All topics created successfully';
      echo '[INFO] Available topics:';
      kafka-topics --list --bootstrap-server kafka:29092;
      "
    networks:
      - kafka-network
    restart: on-failure

networks:
  kafka-network:
    driver: bridge
